<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>Remory — Dreamy Pastel Preview</title><link rel="stylesheet" href="../src/styles.css"/><style>
.preview-hint{position:fixed;left:24px;bottom:20px;background:#ffffffb3;border:1px solid #fff;padding:11px 14px;color:#9e8ba6;border-radius:12px;font-size:11px;max-width:240px;line-height:1.7}
@media(max-width:760px){.preview-hint{display:none}}
</style></head>
<body><div id="root"></div><script>
const asset = file=>`../public/${file}`;
const ico=(name,size=20)=>{const d={cloud:'M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 16.25',arrow:'M5 12h14m-6-6 6 6-6 6',home:'m3 10 9-7 9 7v10H3zM9 20v-6h6v6',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',flower:'M12 12c-2-6-9-6-9-2 0 2 2 4 5 4-6 2-6 9-2 9 3 0 5-3 6-7 1 4 3 7 6 7 4 0 4-7-2-9 3 0 5-2 5-4 0-4-7-4-9 2z',plus:'M12 5v14M5 12h14',chev:'m9 18 6-6-6-6',chart:'M4 20v-8m8 8V4m8 16v-12',code:'m8 17-5-5 5-5m8 10 5-5-5-5',lang:'m5 8 6 6m-8 0 6-6M4 5h11M9 3v2m3 15 5-12 5 12m-8-4h6',landmark:'m3 10 9-7 9 7M4 10h16M6 10v9m6-9v9m6-9v9M3 22h18',check:'m4 12 5 5L20 6',back:'m12 19-7-7 7-7m-7 7h14',rotate:'M3 12a9 9 0 1 0 2.2-5.9M3 4v6h6',search:'m21 21-4.35-4.35M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16',spark:'m12 3 1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9L12 3Z'};
return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d[name]||d.spark}"/></svg>`;};
let page='home',deckId='java',flip=false,reviewIndex=0,finished=false,modal=null,logs=JSON.parse(localStorage.getItem('recall-preview-logs')||'null')||[2,3,2,4,3,5,2],decks=[{id:'english',name:'영어 단어',c:120,t:'peach',icon:'lang'},{id:'java',name:'개발 개념',c:48,t:'lavender',icon:'code'},{id:'history',name:'한국사',c:65,t:'butter',icon:'landmark'},{id:'general',name:'나의 메모',c:32,t:'blue',icon:'book'}], cards=[{d:'java',q:'REST API에서 멱등성이란?',a:'같은 요청을 여러 번 실행해도 서버의 최종 상태가 동일하게 유지되는 성질이에요.'},{d:'english',q:'serendipity',a:'뜻밖의 행운, 우연히 발견한 기쁨'},{d:'history',q:'훈민정음이 반포된 해는?',a:'1446년, 세종 28년이에요.'},{d:'java',q:'트랜잭션의 ACID란?',a:'원자성, 일관성, 격리성, 지속성을 말해요.'}];
const img=(path,cls,alt='')=>`<img class="${cls}" src="${asset(path)}" alt="${alt}"/>`;
const dateLabel=()=>new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
const nav=(id,title,icon)=>`<button class="nav-item ${page===id||(page==='detail'&&id==='decks')?'selected':''}" data-go="${id}"><span class="nav-icon">${ico(icon,21)}</span><span>${title}</span></button>`;
const deckTile=(d)=>`<button class="deck-tile ${d.t}" data-deck="${d.id}"><div class="deck-tile-art"><span class="deck-icon">${ico(d.icon,23)}</span><span class="tile-sparkle">✦</span></div><div><strong>${esc(d.name)}</strong><span>${d.c} cards</span></div></button>`;
const esc =s=>String(s).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const week=()=>`<div class="week-calendar">${['월','화','수','목','금','토','일'].map((d,i)=>`<div class="week-day"><span>${d}</span><div class="week-dot tone-${i%5} ${logs[i]?'active':''}">${logs[i]?ico('check',14):'<span class="week-blank"></span>'}</div></div>`).join('')}</div>`;
function home(){return `<div class="page home-page"><div class="welcome-eyebrow">✦ a little memory, every day</div><div class="welcome-heading"><h1>오늘의 기억도<br/><em>조금씩 피어나요.</em></h1><span class="welcome-heart">♡</span></div><section class="hero"><div class="hero-orb orb-a"></div><div class="hero-orb orb-b"></div><span class="hero-star first">✦</span><span class="hero-star second">✦</span><span class="hero-petal p1">✿</span><span class="hero-petal p2">✧</span>${img('mascot.svg','mascot hero-mascot','구름 캐릭터 몽이')}<div class="hero-content"><span class="small-pill hero-eyebrow">☁ &nbsp; TODAY'S LITTLE MEMORY</span><h2>기억 산책을<br/>떠나볼까요?</h2><p>잊기 전에, 다정하게 다시 만나요.</p></div><div class="hero-action-card"><div class="hero-count"><span>오늘 다시 만날 기억</span><strong>${cards.length}<small> cards</small></strong></div><button class="round-primary" data-go="review" aria-label="복습 시작">${ico('arrow',21)}</button></div></section><section class="week-section"><div class="section-heading"><h3>이번 주의 작은 발자국</h3><span class="caption-side">매일의 조각 ✦</span></div>${week()}</section><section><div class="section-heading"><h3>나의 작은 공부방</h3><button class="subtle-action" data-go="decks">전체보기 ${ico('chev',15)}</button></div><div class="deck-grid">${decks.slice(0,4).map(deckTile).join('')}</div></section><section class="garden-teaser"><div class="garden-teaser-copy"><span>MY LITTLE GARDEN</span><h3>배운 만큼 피어나는<br/>나만의 정원</h3><button data-go="garden">정원 보러 가기 ${ico('arrow',15)}</button></div>${img('mascot.svg','','몽이')}</section><button class="stat-shortcut" data-go="stats"><span class="stat-icon">${ico('chart',21)}</span><span><strong>차곡차곡 쌓인 기억</strong><small>오늘도 기억을 만났어요 · 기록 확인하기</small></span>${ico('chev',18)}</button></div>`;}
function decksPage(){return `<div class="page decks-page"><div class="page-eyebrow">MY LITTLE LIBRARY ✦</div><div class="page-heading"><div><h1>나의 작은 공부방</h1><p>기억하고 싶은 걸 차곡차곡 모아둬요.</p></div><span class="title-doodle">✿</span></div><label class="search-field">${ico('search',19)}<input id="deck-search" placeholder="학습 덱 찾아보기" aria-label="덱 검색"/></label><div class="deck-count-line"><span>나의 학습 덱 <strong>${decks.length}</strong></span><span>언제든 다시 만날 수 있어요 ♡</span></div><div class="deck-grid decks-big" id="deck-items">${decks.map(deckTile).join('')}</div><button class="soft-create" data-modal="deck"><span>${ico('plus',20)}</span>나만의 학습 덱 만들기 ${ico('arrow',18)}</button><div class="note-sticker">${ico('spark',19)}<span>작은 지식도 모이면 커다란 기억이 돼요.</span></div></div>`;}
function detail(){const d=decks.find(x=>x.id===deckId)||decks[0],inDeck=cards.filter(c=>c.d===d.id);return `<div class="page"><button class="back-link" data-go="decks">${ico('back',19)} 학습 덱</button><div class="deck-detail-banner ${d.t}"><span class="detail-mini-art">${ico(d.icon,38)}</span><span class="detail-spark">✦</span><span class="eyebrow-dark">MY STUDY DECK</span><h1>${esc(d.name)}</h1><p>나만의 작은 기억을 오래 간직해요.</p><div class="detail-foot"><span>${inDeck.length}개의 기억 카드</span><button data-go="review">복습하기 ${ico('arrow',17)}</button></div></div><div class="section-heading"><h3>카드 목록</h3><span class="caption-side">${inDeck.length}개 카드</span></div><div class="card-list">${inDeck.map((c,i)=>`<button class="card-list-row" data-toggle-answer="${i}"><span class="list-index">${String(i+1).padStart(2,'0')}</span><span class="list-card-content"><strong>${esc(c.q)}</strong><small style="display:none">${esc(c.a)}</small></span>${ico('chev',17)}</button>`).join('')}</div><button class="soft-create" data-modal="card"><span>${ico('plus',20)}</span>새로운 기억 카드 만들기 ${ico('arrow',18)}</button></div>`;}
function review(){if(finished)return `<div class="page completion"><span class="page-eyebrow">TODAY'S LITTLE ACHIEVEMENT</span><div class="completion-art"><div class="completion-orb"></div><span class="float-star one">✦</span><span class="float-star two">✧</span>${img('mascot.svg','mascot')}</div><h1>오늘의 기억 산책,<br/><em>참 잘했어요!</em></h1><p>${cards.length}개의 기억을 다정하게 다시 만났어요.<br/>오늘의 작은 노력이 내일의 힘이 될 거예요.</p><div class="completion-reward">✿ <span>정원에 반짝임 +${cards.length}</span> ✦</div><button class="big-primary" data-go="garden">기억의 정원 보러 가기 ${ico('arrow',19)}</button><button class="plain-link" data-review-restart>다시 연습하기</button></div>`;
const c=cards[reviewIndex]||cards[0];return `<div class="page review-page"><div class="review-top"><div><span class="page-eyebrow">A MOMENT TO REMEMBER</span><h1>기억 산책 중 ☁️</h1></div><span class="review-index">${reviewIndex+1} <small>/ ${cards.length}</small></span></div><div class="progress-track"><div style="width:${((reviewIndex+1)/cards.length)*100}%"></div></div><p class="review-instruction">마음속으로 답을 떠올린 뒤 카드를 뒤집어 보세요.</p><button class="flashcard ${flip?'flipped':''}" data-flip><span class="flashcard-top"><span>${flip?'THE ANSWER':'A LITTLE QUESTION'}</span><span>✦</span></span><div class="flashcard-content"><span class="flashcard-emoji">${flip?'✦':'☁'}</span><h2>${esc(flip?c.a:c.q)}</h2></div><span class="flashcard-bottom">${flip?'카드를 눌러 질문 다시 보기':'카드를 톡 누르면 정답이 보여요'} ${ico('rotate',15)}</span></button>${!flip?`<button class="big-primary reveal-btn" data-flip>정답 확인하기 ${ico('arrow',19)}</button>`:`<div class="rating-section"><p>이 기억이 얼마나 선명했나요?</p><div class="rating-grid">${[['again','다시','다시 만나기'],['hard','어려움','조금 어려워요'],['good','보통','기억했어요'],['easy','쉬움','또렷해요']].map(r=>`<button class="rating rating-${r[0]}" data-rate="${r[0]}"><span>${r[1]}</span><small>${r[2]}</small></button>`).join('')}</div></div>`}<p class="review-footnote">틀려도 괜찮아요. 기억은 여러 번 만나며 자라니까요. ♡</p></div>`;}
function garden(){return `<div class="page garden-page"><span class="page-eyebrow">WELCOME TO YOUR MEMORY GARDEN</span><div class="page-heading"><div><h1>기억의 정원 ✿</h1><p>느리게 피어나도 괜찮아요.</p></div><span class="title-doodle">✧</span></div><div class="garden-scene"><div class="garden-art large">${img('garden.svg','','기억의 정원')}<span class="garden-floating-star s1">✦</span><span class="garden-floating-star s2">✧</span></div><div class="scene-title"><span>MY LITTLE GARDEN</span><strong>오늘도 작은 기억이<br/>한 송이 피었어요.</strong></div>${img('mascot.svg','mascot scene-mascot','몽이')}</div><div class="garden-message"><div class="message-icon">✿</div><div><strong>꾸준히 자라나는 중이에요</strong><p>공부한 모든 순간이 이 정원의 햇살이 돼요.</p></div></div><div class="section-heading"><h3>나의 기억 씨앗</h3></div><div class="stage-grid">${[1,2,3,4,5].map(s=>`<div class="stage ${s<=Math.min(5,Math.ceil(logs.reduce((a,b)=>a+b,0)/10))?'unlocked':''}"><span>${s<=3?'✿':'✧'}</span><small>${s}단계</small></div>`).join('')}</div><div class="garden-summary"><div><span>지금까지 만난 기억</span><strong>${logs.reduce((a,b)=>a+b,0)}<small>번</small></strong></div><span class="garden-divider"></span><div><span>오늘의 정원 햇살</span><strong>${logs[6]}<small>번</small></strong></div></div><p class="garden-whisper">“한 번에 활짝 피지 않아도 돼요. 조금씩, 오래.”</p></div>`;}
function stats(){const max=Math.max(...logs,1);return `<div class="page stats-page"><button class="back-link" data-go="home">${ico('back',19)} 홈으로</button><span class="page-eyebrow">THE LITTLE THINGS ADD UP</span><h1>차곡차곡 쌓인 기억 ✨</h1><p class="page-subtitle">오늘의 작은 노력도 기록하고 있어요.</p><div class="stat-grid"><div class="stat-block lavender"><span>전체 카드</span><strong>${cards.length}</strong><small>기억의 씨앗</small></div><div class="stat-block peach"><span>이번 주 복습</span><strong>${logs.reduce((a,b)=>a+b,0)}</strong><small>기억을 만난 횟수</small></div></div><div class="chart-panel"><div class="section-heading"><h3>최근 7일 학습량</h3></div><div class="bar-chart">${logs.map((n,i)=>`<div class="bar-col"><div class="bar-container"><div class="bar" style="height:${Math.max(8,n/max*100)}%"></div></div><span>${['월','화','수','목','금','토','일'][i]}</span></div>`).join('')}</div></div><div class="note-sticker">♡ <span>어제보다 조금 더 기억하고 있는 오늘이에요.</span></div></div>`;}
function showModal(){if(!modal)return '';return `<div class="modal-backdrop"><div class="modal-sheet"><div class="sheet-handle"></div><div class="modal-head"><h2>${modal==='deck'?'새로운 공부방 만들기 ✿':'새로운 기억 심기 ✦'}</h2><button class="icon-button" data-close>×</button></div><form class="sheet-form" id="preview-form">${modal==='deck'?`<label>학습 덱 이름<input name="name" required placeholder="예: 정보처리기사 필기"/></label><label>짧은 소개<input name="sub" placeholder="작은 기억을 차곡차곡"/></label>`:`<label>학습 덱<select name="deck">${decks.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('')}</select></label><label>앞면 · 질문<textarea name="q" required rows="3" placeholder="어떤 것을 기억하고 싶나요?"></textarea></label><label>뒷면 · 답<textarea name="a" required rows="4" placeholder="정답이나 설명을 입력해 주세요."></textarea></label>`}<button type="submit" class="big-primary form-submit">${modal==='deck'?'공부방 만들기':'기억 카드 저장하기'} ${ico('arrow',18)}</button></form></div></div>`;}
function render(){document.getElementById('root').innerHTML=`<div class="site-background"><div class="desktop-decoration"><div class="desktop-cloud">☁</div><div class="desktop-copy"><span>YOUR LITTLE MEMORY GARDEN</span><h2>작은 기억이<br/><em>꽃이 되는 곳.</em></h2><p>그날의 배움이 잊히지 않도록,<br/>오늘도 다정하게 다시 만나봐요.</p><div class="desktop-stars">✳ &nbsp; ✧ &nbsp; ✳</div></div></div><main class="phone-shell"><header class="app-header"><div class="brand"><span class="brand-cloud">${ico('cloud',21)}</span><span>remory<span class="brand-dot">.</span></span></div><button class="header-streak" data-go="stats">${ico('flower',15)}<span>오늘도 반짝이는 중</span>${ico('chev',14)}</button></header><div class="app-scroll">${page==='home'?home():page==='decks'?decksPage():page==='detail'?detail():page==='review'?review():page==='garden'?garden():stats()}</div><nav class="bottom-nav">${nav('home','홈','home')}${nav('decks','학습 덱','book')}${nav('review','복습','book')}${nav('garden','기억 정원','flower')}</nav></main><div class="desktop-footer">REMORY ✦ DREAMY PASTEL EXPERIENCE · FRONTEND PROTOTYPE</div><button class="floating-add" data-modal="card" aria-label="새 카드 추가">${ico('plus',23)}</button>${showModal()}</div><div class="preview-hint">시안 체험판 · 메뉴 전환, 카드 뒤집기, 복습 평가, 학습 덱·카드 추가가 가능해요.</div>`;
const search=document.getElementById('deck-search');if(search)search.addEventListener('input',e=>{let value=e.target.value.toLowerCase();document.getElementById('deck-items').innerHTML=decks.filter(d=>d.name.toLowerCase().includes(value)).map(deckTile).join('');});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go; if(page==='review'&&finished){finished=false;reviewIndex=0;flip=false;}render();return;}if(b.dataset.deck){deckId=b.dataset.deck;page='detail';render();return;}if(b.dataset.flip!==undefined){flip=!flip;render();return;}if(b.dataset.rate){logs[6]++;localStorage.setItem('recall-preview-logs',JSON.stringify(logs));flip=false;reviewIndex++;if(reviewIndex>=cards.length)finished=true;render();return;}if(b.dataset.reviewRestart!==undefined){finished=false;reviewIndex=0;flip=false;render();return;}if(b.dataset.modal){modal=b.dataset.modal;render();return;}if(b.dataset.close!==undefined){modal=null;render();return;}if(b.dataset.toggleAnswer!==undefined){const small=b.querySelector('small');if(small)small.style.display=small.style.display==='none'?'block':'none';return;}});
document.addEventListener('submit',e=>{if(e.target.id!=='preview-form')return;e.preventDefault();let fd=new FormData(e.target);if(modal==='deck'){const id='new-'+Date.now();decks.push({id,name:String(fd.get('name')),c:0,t:'lavender',icon:'book'});deckId=id;page='detail';}else{cards.push({d:String(fd.get('deck')),q:String(fd.get('q')),a:String(fd.get('a'))});const found=decks.find(d=>d.id===String(fd.get('deck')));if(found)found.c++;page='detail';deckId=String(fd.get('deck'));}modal=null;render();});
render();
</script></body></html>
